<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 260px; margin: 0; padding: 14px;
      font: 13px/1.4 system-ui, sans-serif; color: #e5e7eb;
      background: #111827;
    }
    h1 { font-size: 13px; margin: 0 0 12px; color: #a78bfa; letter-spacing: .4px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      flex: 1; padding: 8px 10px; border: 0; border-radius: 8px;
      font: 600 13px system-ui, sans-serif; cursor: pointer;
    }
    #fill { background: #7c3aed; color: #fff; }
    #fill:hover { background: #6d28d9; }
    #undo { background: #374151; color: #e5e7eb; }
    #undo:hover { background: #4b5563; }
    label.opt {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; cursor: pointer; color: #d1d5db;
    }
    .seedrow { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 2px; }
    input[type="number"] {
      width: 90px; background: #1f2937; color: #e5e7eb;
      border: 1px solid #374151; border-radius: 6px; padding: 4px 6px; font: 12px system-ui;
    }
    input[type="checkbox"] { accent-color: #7c3aed; }
    #stats { margin-top: 10px; font-size: 12px; color: #9ca3af; min-height: 16px; }
    #stats b { color: #a78bfa; }
    .hint { margin-top: 8px; font-size: 11px; color: #6b7280; }
    kbd { background:#1f2937; border-radius:4px; padding:1px 5px; font-size:10px; }
  </style>
</head>
<body>
  <h1>UA FAKE FILLER</h1>
  <div class="row">
    <button id="fill">Fill</button>
    <button id="undo">Undo</button>
  </div>
  <div class="seedrow">
    <span>Seed (0 = random)</span>
    <input id="seed" type="number" min="0" step="1" value="0" />
  </div>
  <label class="opt">Skip filled fields <input id="skipFilled" type="checkbox" checked /></label>
  <label class="opt">Fill passwords <input id="fillPasswords" type="checkbox" checked /></label>
  <label class="opt">Highlight fills <input id="highlight" type="checkbox" checked /></label>
  <div id="stats"></div>
  <div class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd>, or right-click the page.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
